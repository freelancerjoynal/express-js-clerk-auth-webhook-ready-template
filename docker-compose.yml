services:
  db:
    image: postgres:18
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-clerk}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-clerk_pass}
      POSTGRES_DB: ${POSTGRES_DB:-clerk_db}
    ports:
      - "5432:5432"
    volumes:
      # ইন্টারনাল পাথটি পরিবর্তন করে শুধু /var/lib/postgresql দিন
      - db_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clerk"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  db_data: